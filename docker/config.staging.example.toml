# Non-secret settings; install as /etc/photo-proofing/config.toml.
# Database credentials are injected by Doppler, never stored here.
host = "0.0.0.0"
port = 8080
log_level = "info"

[auth]
app_origin = "https://pp.test"

[session]
idle_timeout = "30d"
secure_cookie = true
cookie_name = "pp_session"

[photo]
dir = "/var/lib/pp/photos"
