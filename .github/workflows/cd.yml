name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build-image:
    name: Build ${{ matrix.name }} image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: ghcr.io/alekece/pp-api
            file: docker/api.Dockerfile
            sha_arg: true
          - name: image-worker
            image: ghcr.io/alekece/pp-image-worker
            file: docker/worker.Dockerfile
            sha_arg: false
          - name: web
            image: ghcr.io/alekece/pp-web
            file: docker/web.production.Dockerfile
            sha_arg: true
    env:
      TAG: sha-${{ github.event.workflow_run.head_sha }}
      REVISION: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for an existing image
        id: existing
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if inspection="$(docker buildx imagetools inspect "$IMAGE:$TAG" 2>&1)"; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Reusing existing image: $IMAGE:$TAG"
          elif grep -Eiq '(^|[^0-9])404([^0-9]|$)|manifest unknown|not found' <<< "$inspection"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$inspection" >&2
            exit 1
          fi
      - name: Build and publish the image
        if: steps.existing.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ matrix.image }}:${{ env.TAG }}
          build-args: ${{ matrix.sha_arg && format('PP_BUILD_SHA={0}', env.REVISION) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.REVISION }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  promote-staging:
    name: Promote staging images
    needs: build-image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify all images are available
        env:
          TAG: sha-${{ github.event.workflow_run.head_sha }}
        run: |
          docker buildx imagetools inspect "ghcr.io/alekece/pp-api:$TAG" >/dev/null
          docker buildx imagetools inspect "ghcr.io/alekece/pp-image-worker:$TAG" >/dev/null
          docker buildx imagetools inspect "ghcr.io/alekece/pp-web:$TAG" >/dev/null
      - name: Advance staging tag
        env:
          CANDIDATE: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code origin refs/tags/staging >/dev/null; then
            git fetch --force origin refs/tags/staging:refs/tags/staging
            current_ref="$(git rev-parse refs/tags/staging)"
            current_commit="$(git rev-parse 'refs/tags/staging^{commit}')"

            if [ "$current_commit" = "$CANDIDATE" ]; then
              echo "staging already points to $CANDIDATE"
            elif git merge-base --is-ancestor "$current_commit" "$CANDIDATE"; then
              git tag -f staging "$CANDIDATE"
              git push --force-with-lease="refs/tags/staging:$current_ref" origin refs/tags/staging:refs/tags/staging
            elif git merge-base --is-ancestor "$CANDIDATE" "$current_commit"; then
              echo "staging already points to a newer commit; leaving it unchanged"
            else
              echo "staging and candidate commits have diverged" >&2
              exit 1
            fi
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            git tag staging "$CANDIDATE"
            git push origin refs/tags/staging:refs/tags/staging
          fi
      - name: Move staging image tags
        env:
          CANDIDATE: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Only the newest commit may move the tags; the Git tag is the ordering authority.
          if [ "$(git rev-parse 'refs/tags/staging^{commit}')" != "$CANDIDATE" ]; then
            echo "staging points to a newer commit; leaving image tags unchanged"
            exit 0
          fi

          for image in pp-api pp-image-worker pp-web; do
            docker buildx imagetools create \
              --tag "ghcr.io/alekece/$image:staging" \
              "ghcr.io/alekece/$image:sha-$CANDIDATE"
          done
