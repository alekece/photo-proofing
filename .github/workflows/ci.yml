name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Skipped jobs count as passing for required checks, unlike workflows skipped by a paths filter
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.rust }}
      web: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.web }}
      containers: ${{ steps.filter.outputs.containers }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - "crates/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rustfmt.toml"
              - "deny.toml"
              - ".github/workflows/ci.yml"
            web:
              - "web/**"
              - ".github/workflows/ci.yml"
            containers:
              - "crates/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "web/**"
              - "docker/**"
              - ".dockerignore"

  rust-fmt:
    name: Rust format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustfmt.toml uses group_imports, which only nightly rustfmt supports
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --check

  rust-lint:
    name: Rust clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-deny:
    name: Rust dependencies
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace

  rust-test:
    name: Rust tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pp
          POSTGRES_PASSWORD: pp-ci-only
          POSTGRES_DB: pp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pp -d pp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database; not a real credential
      DATABASE_URL: postgres://pp:pp-ci-only@localhost:5432/pp_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  rust-build:
    name: Rust release build
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release

  web-fmt:
    name: Web format
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  web-lint:
    name: Web lint and check
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check

  web-audit:
    name: Web dependencies
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm audit --prod

  web-test:
    name: Web tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  web-build:
    name: Web build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  container-build:
    name: Build application images
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --load --file docker/api.Dockerfile --tag pp-api:ci .
      - run: docker buildx build --load --file docker/worker.Dockerfile --tag pp-image-worker:ci .
      - run: docker buildx build --load --file docker/web.production.Dockerfile --tag pp-web:ci .

  publish-images:
    name: Publish staging images
    needs:
      - changes
      - rust-fmt
      - rust-lint
      - rust-deny
      - rust-test
      - rust-build
      - web-fmt
      - web-lint
      - web-audit
      - web-test
      - web-build
      - container-build
    if: >-
      always() &&
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["success","skipped"]'), needs.changes.result) &&
      contains(fromJSON('["success","skipped"]'), needs.rust-fmt.result) &&
      contains(fromJSON('["success","skipped"]'), needs.rust-lint.result) &&
      contains(fromJSON('["success","skipped"]'), needs.rust-deny.result) &&
      contains(fromJSON('["success","skipped"]'), needs.rust-test.result) &&
      contains(fromJSON('["success","skipped"]'), needs.rust-build.result) &&
      contains(fromJSON('["success","skipped"]'), needs.web-fmt.result) &&
      contains(fromJSON('["success","skipped"]'), needs.web-lint.result) &&
      contains(fromJSON('["success","skipped"]'), needs.web-audit.result) &&
      contains(fromJSON('["success","skipped"]'), needs.web-test.result) &&
      contains(fromJSON('["success","skipped"]'), needs.web-build.result) &&
      contains(fromJSON('["success","skipped"]'), needs.container-build.result)
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build missing API image
        id: api-image
        env:
          IMAGE: ghcr.io/alekece/pp-api
          TAG: sha-${{ github.sha }}
        run: |
          if inspection="$(docker buildx imagetools inspect "$IMAGE:$TAG" 2>&1)"; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Reusing existing image: $IMAGE:$TAG"
          elif grep -Eiq '(^|[^0-9])404([^0-9]|$)|manifest unknown|not found' <<< "$inspection"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            docker buildx build --load \
              --file docker/api.Dockerfile \
              --tag "$IMAGE:$TAG" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              .
          else
            printf '%s\n' "$inspection" >&2
            exit 1
          fi
      - name: Build missing image-worker image
        id: image-worker-image
        env:
          IMAGE: ghcr.io/alekece/pp-image-worker
          TAG: sha-${{ github.sha }}
        run: |
          if inspection="$(docker buildx imagetools inspect "$IMAGE:$TAG" 2>&1)"; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Reusing existing image: $IMAGE:$TAG"
          elif grep -Eiq '(^|[^0-9])404([^0-9]|$)|manifest unknown|not found' <<< "$inspection"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            docker buildx build --load \
              --file docker/worker.Dockerfile \
              --tag "$IMAGE:$TAG" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              .
          else
            printf '%s\n' "$inspection" >&2
            exit 1
          fi
      - name: Build missing web image
        id: web-image
        env:
          IMAGE: ghcr.io/alekece/pp-web
          TAG: sha-${{ github.sha }}
        run: |
          if inspection="$(docker buildx imagetools inspect "$IMAGE:$TAG" 2>&1)"; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Reusing existing image: $IMAGE:$TAG"
          elif grep -Eiq '(^|[^0-9])404([^0-9]|$)|manifest unknown|not found' <<< "$inspection"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            docker buildx build --load \
              --file docker/web.production.Dockerfile \
              --tag "$IMAGE:$TAG" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              .
          else
            printf '%s\n' "$inspection" >&2
            exit 1
          fi
      - name: Publish missing API image
        if: steps.api-image.outputs.build == 'true'
        env:
          IMAGE: ghcr.io/alekece/pp-api
          TAG: sha-${{ github.sha }}
        run: docker push "$IMAGE:$TAG"
      - name: Publish missing image-worker image
        if: steps.image-worker-image.outputs.build == 'true'
        env:
          IMAGE: ghcr.io/alekece/pp-image-worker
          TAG: sha-${{ github.sha }}
        run: docker push "$IMAGE:$TAG"
      - name: Publish missing web image
        if: steps.web-image.outputs.build == 'true'
        env:
          IMAGE: ghcr.io/alekece/pp-web
          TAG: sha-${{ github.sha }}
        run: docker push "$IMAGE:$TAG"
      - name: Verify all images are available
        env:
          TAG: sha-${{ github.sha }}
        run: |
          docker buildx imagetools inspect "ghcr.io/alekece/pp-api:$TAG" >/dev/null
          docker buildx imagetools inspect "ghcr.io/alekece/pp-image-worker:$TAG" >/dev/null
          docker buildx imagetools inspect "ghcr.io/alekece/pp-web:$TAG" >/dev/null
      - name: Advance staging tag
        env:
          CANDIDATE: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code origin refs/tags/staging >/dev/null; then
            git fetch --force origin refs/tags/staging:refs/tags/staging
            current_ref="$(git rev-parse refs/tags/staging)"
            current_commit="$(git rev-parse 'refs/tags/staging^{commit}')"

            if [ "$current_commit" = "$CANDIDATE" ]; then
              echo "staging already points to $CANDIDATE"
            elif git merge-base --is-ancestor "$current_commit" "$CANDIDATE"; then
              git tag -f staging "$CANDIDATE"
              git push --force-with-lease="refs/tags/staging:$current_ref" origin refs/tags/staging:refs/tags/staging
            elif git merge-base --is-ancestor "$CANDIDATE" "$current_commit"; then
              echo "staging already points to a newer commit; leaving it unchanged"
            else
              echo "staging and candidate commits have diverged" >&2
              exit 1
            fi
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            git tag staging "$CANDIDATE"
            git push origin refs/tags/staging:refs/tags/staging
          fi
