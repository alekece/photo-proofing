name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Skipped jobs count as passing for required checks, unlike workflows skipped by a paths filter
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.rust }}
      web: ${{ github.event_name == 'push' && 'true' || steps.filter.outputs.web }}
      containers: ${{ github.event_name == 'pull_request' && steps.filter.outputs.containers }}
      staging: ${{ steps.filter.outputs.staging }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - "crates/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rustfmt.toml"
              - "deny.toml"
              - ".github/workflows/ci.yml"
              - ".github/workflows/cd.yml"
            web:
              - "web/**"
              - ".github/workflows/ci.yml"
              - ".github/workflows/cd.yml"
            # Code changes are compiled and tested by the Rust and web jobs; images only break
            # when their build inputs change. CD builds the images on main.
            containers:
              - "Cargo.lock"
              - "web/pnpm-lock.yaml"
              - "docker/**"
              - ".dockerignore"
              - ".github/workflows/ci.yml"
              - ".github/workflows/cd.yml"
            staging:
              - "deploy/**"
              - "config.example.toml"
              - ".github/workflows/ci.yml"

  deployment-checks:
    name: Deployment checks
    needs: changes
    if: needs.changes.outputs.staging == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the dashboard stack with synthetic values
        env:
          POSTGRES_PASSWORD: synthetic
          PP_DATABASE_URL: postgres://pp:synthetic@postgres:5432/pp
          PP_APP_ORIGIN: https://proofing.example
          PP_STAGING_HOST: proofing.example
          PP_BIND_ADDRESS: 127.0.0.1
          PP_POSTGRES_VOLUME: example-postgres
          PP_PHOTO_VOLUME: example-photos
          PP_CADDY_DATA_VOLUME: example-caddy-data
          PP_CADDY_CONFIG_VOLUME: example-caddy-config
        run: docker compose -f deploy/compose.yml config --quiet

  rust-fmt:
    name: Rust format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustfmt.toml uses group_imports, which only nightly rustfmt supports
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --check

  rust-lint:
    name: Rust clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-deny:
    name: Rust dependencies
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace

  rust-test:
    name: Rust tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pp
          POSTGRES_PASSWORD: pp-ci-only
          POSTGRES_DB: pp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pp -d pp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database; not a real credential
      DATABASE_URL: postgres://pp:pp-ci-only@localhost:5432/pp_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  web-fmt:
    name: Web format
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  web-lint:
    name: Web lint and check
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check

  web-audit:
    name: Web dependencies
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm audit --prod

  web-test:
    name: Web tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  web-build:
    name: Web build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  container-build:
    name: Build ${{ matrix.name }} image
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: docker/api.Dockerfile
          - name: image-worker
            file: docker/worker.Dockerfile
          - name: web
            file: docker/web.production.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Layers are written by CD on main; PRs only read them
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
