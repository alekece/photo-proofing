name: Pick issues

# Plain workflow (no LLM, so not a gh-aw source): selects eligible `agent` issues and
# dispatches one implement-issue run per issue. Eligibility lives in
# the step below; implement-issue revalidates the design and exits cleanly if absent.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: Override AGENT_MAX_ISSUES for this run (0 pauses)
        required: false
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: write

concurrency:
  group: pick-issues
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MAX: ${{ inputs.max || vars.AGENT_MAX_ISSUES || '1' }}
    steps:
      - name: Select and dispatch
        run: |
          [ "$MAX" -gt 0 ] || exit 0

          gh issue list --label agent --search "-label:needs-attention -label:blocked" --limit 100 \
            --json number,createdAt,milestone --jq 'sort_by([.milestone.dueOn // "9", .createdAt]) | .[] | .number' |
          while read -r n; do
            [ "$MAX" -gt 0 ] || break
            [ "$(gh api "repos/$GH_REPO/issues/$n" --jq '(.sub_issues_summary.total // 0) - (.sub_issues_summary.completed // 0)')" = 0 ] || continue
            [ "$(gh api "repos/$GH_REPO/issues/$n/dependencies/blocked_by" --jq '[.[] | select(.state == "open")] | length')" = 0 ] || continue
            gh pr list --state open --json headRefName --jq '.[].headRefName' | grep -Eq "^[a-z]+/$n-" && continue
            gh workflow run implement-issue.lock.yml -f issue="$n" && MAX=$((MAX - 1))
          done
