name: CI image

# Publishes the toolchain image used by the Rust CI jobs. It is rebuilt weekly to pick up new
# stable Rust releases and security updates.
on:
  push:
    branches: [main]
    paths:
      - "docker/ci.Dockerfile"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "docker/ci.Dockerfile"
      - ".github/workflows/image.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish CI image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pull requests only check that the image builds
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ci.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/alekece/pp-ci:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
