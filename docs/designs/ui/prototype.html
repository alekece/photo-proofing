<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhotoProofing · playable demo</title>
<style>
:root{--ink:#2b2420;--muted:#6f6255;--page:#f4efe8;--panel:#fbf8f3;--line:#e0d6c8;--accent:#b5381f;--info:#5b6f7e;--ok:#3f6b4a;--warn:#ffb59f;--dark:#16120f;--cw:3px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
svg{flex:none}
img{-webkit-user-drag:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dis,[aria-disabled=true]{opacity:.38;pointer-events:none}
.sp{flex:1}
.lbl{font:600 11px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--panel)}
.btn.pri:hover{background:#3d332d}
.btn.gh{border:1px solid var(--line);background:var(--panel)}
.btn.gh:hover{border-color:#cdbda9}
.btn.sm{padding:7px 14px;font-size:13.5px}
.btn.dz{background:var(--accent);color:#fbf8f3}
.btn:disabled{opacity:.38;cursor:default;transform:none}
.flash{animation:flash .6s ease-out}
@keyframes flash{0%{background:rgba(255,213,150,.7)}100%{background:transparent}}

/* ---------- studio top bar ---------- */
.top{display:flex;align-items:center;gap:16px;padding:14px 32px;border-bottom:1px solid var(--line);position:relative;z-index:20}
.brand{color:inherit;text-decoration:none;font:400 21px/1 Georgia,serif;letter-spacing:.01em;cursor:pointer;white-space:nowrap}
.crumb{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bell{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.bell:hover{background:rgba(120,100,80,.12)}
.langb{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:600 12.5px/1 system-ui;letter-spacing:.04em}
.langb:hover,.langb[aria-expanded=true]{background:rgba(120,100,80,.12)}
.menu button{display:flex;width:100%;gap:10px;align-items:center;padding:8px 12px;border-radius:6px;font-size:14px;text-align:left;color:var(--ink)}
.menu button:hover{background:#efe7dc}
.menu.lm{min-width:170px}
.menu .tick{width:16px;display:grid;place-items:center;visibility:hidden}
.menu [aria-checked=true] .tick{visibility:visible}
.bell b{position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:#fff;font:700 10px/17px system-ui;text-align:center;border:2px solid var(--page)}
.avatar{width:34px;height:34px;border-radius:50%;background:#c9b49a url(https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=80&q=70&auto=format) center/cover;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.menuwrap{position:relative}
.menu{display:none;position:absolute;right:0;top:44px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 40px -20px rgba(43,36,32,.5);min-width:220px;padding:6px;z-index:30}
.menu.open{display:block}
.menu .who{padding:10px 12px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .who strong{display:block;font-weight:600}
.menu .who span{font-size:13px;color:var(--muted)}
.menu a,.menu a:visited{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:6px;font-size:14px;cursor:pointer;color:var(--ink);background:var(--panel);text-decoration:none}
.menu a:hover{background:#efe7dc}
.panel{display:none;position:absolute;top:58px;right:70px;width:340px;max-width:calc(100vw - 24px);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 50px -24px rgba(43,36,32,.55);z-index:30;overflow:hidden}
.panel.open{display:block;animation:drop .18s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}
.panel .ph{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel .ph strong{font:400 18px Georgia,serif}
.panel .ph a{font-size:13px;color:var(--accent);cursor:pointer}
.panel .ph a.dis{color:var(--muted)}
.panel .it{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;width:100%;text-align:left;position:relative}
.panel .it:last-child{border-bottom:0}
.panel .it:hover{background:#f3ece2}
.panel .it img,.panel .it .ei{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:none;background:#e6dccd}
.panel .it span{display:block;color:var(--muted);font-size:12px}
.panel .it.un::after{content:"";position:absolute;right:14px;top:18px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.panel .it.un strong{font-weight:700}
.panel .it strong{font-weight:500}
.panel .zero{padding:22px 16px;color:var(--muted);font-size:14px;text-align:center}

/* ---------- dashboard ---------- */
.dash{min-height:100vh;display:flex;flex-direction:column}
.dhero{padding:24px 32px 26px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px}
.dhero h1{font:400 44px/1.05 Georgia,serif;margin:0 0 10px}
.dhero h1 em{color:var(--accent)}
.news{display:flex;gap:10px;flex-wrap:wrap}
.news button{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px 8px 8px;font-size:14px;text-align:left;animation:rise .3s ease-out both}
.news button:hover{border-color:#cbb9a3}
.news button img,.news button .ei{width:36px;height:36px;border-radius:6px;object-fit:cover;background:#e6dccd}
.news button strong{display:block;font-weight:600}
.news button span{color:var(--muted);font-size:12px}
.news .x{color:var(--accent);font-weight:800}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.dbar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:0 32px 22px;padding:10px 12px 10px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;position:sticky;top:8px;z-index:6}
.dbar .q{display:flex;align-items:center;gap:8px;flex:1;min-width:160px}
.dbar input{border:0;background:none;outline:none;width:100%;font-size:15px}
.dd{position:relative}
.ddb{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--page);font-size:14px;white-space:nowrap}
.ddb:hover,.dd.open .ddb{border-color:#cbb9a3;background:#efe8de}
.ddb b{font-weight:600}
.ddm{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 40px -20px rgba(43,36,32,.5);padding:6px;z-index:12}
.dd.open .ddm{display:block;animation:drop .15s ease-out}
.ddm .sep{height:1px;background:var(--line);margin:6px 4px}
.ddm button{display:flex;width:100%;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;font-size:14px;text-align:left}
.ddm button:hover{background:#efe7dc}
.ddm .box{width:16px;height:16px;border:1.5px solid #b9aa97;border-radius:4px;display:grid;place-items:center;background:var(--panel)}
.ddm [aria-checked=true] .box{background:var(--ink);border-color:var(--ink)}
.ddm .tick{width:16px;display:grid;place-items:center;visibility:hidden}
.ddm [aria-checked=true] .tick{visibility:visible}
.ddm .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.ddm .n{margin-left:auto;color:var(--muted);font-size:12px}
.ddm .foot{display:flex;justify-content:space-between;padding:8px 12px 4px;font-size:13px}
.ddm .foot a{color:var(--accent);cursor:pointer}
.s-dra{color:var(--muted)}.s-pro{color:var(--info)}.s-del{color:var(--ok)}.s-exp{color:#9a6a12}.s-arc{color:#8a7d6f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;padding:0 32px}
.bcard{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/5;color:#fbf8f3;box-shadow:0 14px 30px -18px rgba(43,36,32,.6);cursor:pointer;transition:transform .25s;text-align:left;display:block;width:100%;animation:rise .35s ease-out both}
.bcard:hover{transform:translateY(-3px)}
.bcard img{display:block;width:100%;height:100%;object-fit:cover}
.bcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,36,32,0) 40%,rgba(43,36,32,.82) 100%)}
.bcard .ov{position:absolute;left:0;right:0;bottom:0;padding:16px 18px;z-index:1}
.bcard h3{font:400 23px/1.1 Georgia,serif;margin:0 0 6px}
.bcard .s{font-size:13px;opacity:.92}
.bcard .x{color:var(--warn);font-weight:800}
.bcard .chip{position:absolute;top:12px;right:12px;z-index:2;background:rgba(251,248,243,.92);padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.bcard .chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.bcard .new{display:inline-block;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;margin-bottom:8px;letter-spacing:.02em}
.bcard.arc img,.bcard.exp img{filter:grayscale(.6) brightness(.9)}
.bcard .empty{display:grid;place-items:center;height:100%;background:repeating-linear-gradient(45deg,#efe7dc 0 10px,#f6f0e8 10px 20px)}
mark{background:rgba(255,213,150,.55);color:inherit;border-radius:2px;padding:0 1px}
.grid .none{grid-column:1/-1;text-align:center;padding:56px 0 40px;color:var(--muted)}
.grid .none h3{font:400 24px/1.2 Georgia,serif;color:var(--ink);margin:0 0 6px}
.grid .none button{margin-top:14px;border:1px solid var(--line);padding:8px 16px;border-radius:999px;background:var(--panel);font-size:14px}
.nextcard{aspect-ratio:4/5;border:1.5px dashed #cdbda9;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--muted);background:radial-gradient(120% 80% at 50% 30%,#faf5ee,transparent 70%);transition:border-color .25s,background-color .25s,color .25s;width:100%}
.nextcard strong{font:italic 400 22px/1.2 Georgia,serif;color:var(--ink)}
.nextcard .frm{position:relative;width:86px;height:64px;display:grid;place-items:center;margin-bottom:8px;color:#a8977f;transition:color .25s,transform .35s cubic-bezier(.2,.8,.2,1)}
.nextcard .frm i{position:absolute;width:14px;height:14px;border:2px solid currentColor}
.nextcard .frm i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.nextcard .frm i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.nextcard .frm i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.nextcard .frm i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.nextcard:hover{border-color:var(--accent);background-color:#f8f1e8}
.nextcard:hover .frm{color:var(--accent);transform:scale(.88)}
.dash footer{margin-top:auto;padding:34px 32px 30px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.dash .grid+footer{margin-top:48px}
.dash footer .sig{font:italic 400 26px/1 Georgia,serif}
.dash footer .sig small{display:block;font:13px/1.6 system-ui;color:var(--muted);font-style:normal;margin-top:6px}
.dash footer .meta{font-size:13px;color:var(--muted);text-align:right}

/* empty workspace: contact sheet under a viewfinder that cannot find a subject */
.dbar.off{opacity:.55}
.dbar.off .q{pointer-events:none}
.blank{display:flex;flex-direction:column;align-items:center;padding:4px 32px 56px;animation:rise .4s ease-out both}
.blank h2{font:italic 400 26px/1.2 Georgia,serif;margin:22px 0 0;color:var(--ink)}
.cs{--fw:17cqw;container-type:inline-size;position:relative;width:min(860px,100%);aspect-ratio:2/1;overflow:hidden;border-radius:6px;background:radial-gradient(60% 70% at 78% 18%,rgba(214,105,63,.16),transparent 70%),radial-gradient(90% 90% at 45% 45%,#2e241d,#16120f 72%);box-shadow:0 30px 60px -32px rgba(43,36,32,.8)}
.cs::after{content:"";position:absolute;inset:0;background:radial-gradient(75% 75% at 50% 48%,transparent 55%,rgba(0,0,0,.55));pointer-events:none}
.cs .sheet{position:absolute;inset:0;animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{filter:blur(0);transform:scale(1)}50%{filter:blur(1.4px);transform:scale(1.015)}}
.cs .rl{position:absolute;left:-12%;width:124%;overflow:hidden;background:#100c0a;padding:calc(var(--fw)*.17) 0 calc(var(--fw)*.24);box-shadow:0 18px 30px -18px #000}
.cs .rl::before,.cs .rl::after{content:"";position:absolute;left:0;right:0;height:calc(var(--fw)*.055);background:repeating-linear-gradient(90deg,transparent 0 calc(var(--fw)*.07),#2c241e calc(var(--fw)*.07) calc(var(--fw)*.14),transparent calc(var(--fw)*.14) calc(var(--fw)*.19))}
.cs .rl::before{top:calc(var(--fw)*.05)}.cs .rl::after{bottom:calc(var(--fw)*.05)}
.cs .r1{top:5%;transform:rotate(-3deg)}
.cs .r2{bottom:15%;transform:rotate(2deg)}
.cs .rn{display:flex;gap:calc(var(--fw)*.09);width:max-content;animation:roll 160s linear infinite}
.cs .r2 .rn{animation-direction:reverse;animation-duration:200s}
.cs .fx{position:relative;width:var(--fw);aspect-ratio:3/2;border-radius:2px;background:linear-gradient(160deg,#241c16,#1a1410);box-shadow:inset 0 0 0 1px rgba(255,240,220,.04)}
.cs .fx span{position:absolute;left:0;bottom:calc(var(--fw)*-.15);font:600 calc(var(--fw)*.062)/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;color:#d9792e;opacity:.75;white-space:nowrap}
.cs .leak{position:absolute;inset:-10% -40%;background:linear-gradient(105deg,transparent 38%,rgba(232,110,50,.26) 47%,rgba(255,206,140,.2) 52%,transparent 61%);mix-blend-mode:screen;pointer-events:none;animation:leak 13s ease-in-out infinite;opacity:0}
@keyframes leak{0%{transform:translateX(-45%);opacity:0}12%{opacity:1}50%{transform:translateX(45%);opacity:0}100%{transform:translateX(45%);opacity:0}}
.cs .vfx{position:absolute;left:50%;top:44%;width:38cqw;aspect-ratio:3/2;transform:translate(-50%,-50%);z-index:1}
.cs .vfx i{position:absolute;width:3.4cqw;height:3.4cqw;border:0 solid rgba(239,230,218,.82)}
.cs .vfx i:nth-child(1){left:0;top:0;border-width:2px 0 0 2px}.cs .vfx i:nth-child(2){right:0;top:0;border-width:2px 2px 0 0}
.cs .vfx i:nth-child(3){left:0;bottom:0;border-width:0 0 2px 2px}.cs .vfx i:nth-child(4){right:0;bottom:0;border-width:0 2px 2px 0}
.cs .vfx b{position:absolute;left:50%;top:50%;width:6cqw;height:4.2cqw;margin:-2.1cqw 0 0 -3cqw;border:1.5px solid rgba(239,230,218,.8);animation:afb 7s ease-in-out infinite}
.cs .vfx b::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;border-radius:50%;background:currentColor;color:rgba(239,230,218,.8)}
@keyframes afb{0%,100%{transform:scale(1);border-color:rgba(239,230,218,.8)}50%{transform:scale(1.18);border-color:var(--warn)}}
.cs .hud{position:absolute;left:0;right:0;bottom:4.5%;z-index:1;display:flex;justify-content:center;gap:2.6cqw;font:max(9px,1.45cqw) ui-monospace,Menlo,monospace;color:#cfc3b5;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.cs .hud .bad{color:var(--warn);font-weight:700}

/* ---------- gallery page ---------- */
.wrap{position:relative}
.wrap>.top{position:absolute;inset:0 0 auto 0;border:0;color:#fbf8f3}
.wrap>.top .crumb{color:rgba(251,248,243,.8)}
.wrap>.top .bell:hover,.wrap>.top .langb:hover,.wrap>.top .langb[aria-expanded=true]{background:rgba(251,248,243,.14)}
.wrap>.top .bell b{border-color:transparent}
.banner{position:relative;height:400px;color:#fbf8f3;display:flex;align-items:flex-end;gap:16px;padding:26px 32px 98px;overflow:hidden}
.banner>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;animation:fadein .5s ease-out}
@keyframes fadein{from{opacity:0}}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,36,32,.45),rgba(43,36,32,0) 35%,rgba(43,36,32,.78));pointer-events:none}
.banner>*{position:relative;z-index:1}
.banner .t{flex:1;min-width:0}
.banner h1{font:400 46px/1 Georgia,serif;margin:8px 0 6px;cursor:text}
.banner h1:hover{text-decoration:underline dotted rgba(251,248,243,.5);text-underline-offset:6px}
.banner .meta{font-size:14px;opacity:.9}
.banner .acts{display:flex;gap:10px}
.banner .btn.gh{background:rgba(251,248,243,.14);border-color:rgba(251,248,243,.4);color:#fbf8f3;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.banner .btn.gh:hover{background:rgba(251,248,243,.24)}
.banner .btn.pri{background:#fbf8f3;color:var(--ink)}
.banner.empty{background:linear-gradient(160deg,#3a2f28,#241d19 60%,#2e2420)}
.banner.arch>img{filter:grayscale(.7) brightness(.85)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(251,248,243,.92);color:var(--info)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.draft{color:var(--muted)}.chip.live{color:var(--info)}.chip.done{color:var(--ok)}.chip.exp{color:#9a6a12}.chip.arc{color:#8a7d6f}
/* default cover when no hero is set (gallery banner and client covers) */
.nohero{background:radial-gradient(55% 80% at 82% 10%,rgba(214,105,63,.22),transparent 70%),radial-gradient(80% 120% at 20% 100%,#3a2a20,transparent 70%),linear-gradient(160deg,#2b211b,#16120f 70%)!important}
.deco{position:absolute!important;inset:0;z-index:0!important;overflow:hidden;pointer-events:none}
.deco .ini{position:absolute;right:4%;top:50%;transform:translateY(-50%);font:italic 400 clamp(150px,24vw,330px)/1 Georgia,serif;color:rgba(251,248,243,.07);white-space:nowrap;letter-spacing:-.02em}
.deco .edge{position:absolute;left:32px;right:32px;top:78px;font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;color:#d9792e;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deco .edge::before{content:"";display:block;height:6px;margin-bottom:8px;background:repeating-linear-gradient(90deg,rgba(251,248,243,.14) 0 8px,transparent 8px 18px);width:min(420px,100%)}
.deco .leak{position:absolute;inset:-20% -40%;background:linear-gradient(105deg,transparent 40%,rgba(232,110,50,.16) 48%,rgba(255,206,140,.12) 52%,transparent 60%);animation:leak 16s ease-in-out infinite;opacity:0}
.ccov .deco .edge{top:100px;text-align:center}
.ccov .deco .edge::before{margin:0 auto 8px}
.ccov .deco .ini{right:50%;transform:translate(50%,-62%)}
.cl .ccv .deco .edge{top:62px;text-align:left}
.strip{position:absolute!important;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;padding:0 32px;background:rgba(32,26,22,.74);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border-top:1px solid rgba(251,248,243,.18);color:rgba(251,248,243,.85)}
.strip .st{display:flex;gap:8px;align-items:center;padding:12px 0;white-space:nowrap;font-size:12.5px;position:relative}
.strip .st>div{display:flex;flex-direction:column;line-height:1.3}
.strip .st strong{color:#fbf8f3;font-weight:600;font-size:13.5px}
.strip .st:not(.cur):not(.done){opacity:.75}
.strip .st .n{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(251,248,243,.5);display:grid;place-items:center;font:700 10px system-ui;flex:none;color:#fbf8f3;transition:background .3s,border-color .3s}
.strip .done .n{background:#5f8f69;border-color:#5f8f69}
.strip .cur{box-shadow:inset 0 -2px 0 var(--warn)}
.strip .cur .n{border-color:var(--warn);color:var(--warn)}
.strip .x{color:var(--warn);font-weight:800}
.strip .ln{flex:1;height:1.5px;background:rgba(251,248,243,.25);max-width:120px}
.strip .ln.ok{background:#5f8f69;opacity:.8}
.ps{display:none;position:absolute!important;left:0;right:0;bottom:0;background:rgba(32,26,22,.74);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid rgba(251,248,243,.18);padding:11px 18px;align-items:center;gap:12px;color:#fbf8f3;font-size:12.5px}

/* ---------- overlays, dialogs, toasts ---------- */

.dlg.one{grid-template-columns:1fr}
.stack{position:relative;width:96px;height:96px}

.dlg.sh{position:relative;grid-template-rows:auto auto}
.dlg.sh .vis{grid-row:1;grid-column:1;position:relative;width:96px;height:96px}
.dlg.sh .vis .okc{position:absolute;inset:0;transform:scale(.4);opacity:0}

/* ---------- upload simulation: wait → uploading → processing → ready, one failure per larger batch ---------- */
function upload(g,tab){
  const list=tab==='final'?g.finals:g.photos,n=tab==='final'?8:6,base=list.length;
  const fresh=Array.from({length:n},(_,i)=>({id:'p'+(++uid),img:P[(base+i+(tab==='final'?5:0))%P.length],st:'wait',fav:false,dl:false,name:`DSC_0${612+base+i}.jpg`}));
  list.push(...fresh);touch(g);
  const failAt=n>=6?4:-1;
  fresh.forEach((p,i)=>{
    later(()=>{p.st='up';render()},400+i*450);
    later(()=>{if(i===failAt){p.st='fail';render();toast(t('upload.fail'),false);return}p.st='proc';render()},1500+i*450);
    later(()=>{if(p.st!=='proc')return;p.st='ok';touch(g);render()},2500+i*450);
  });
  render();
}
function retryPhoto(g,p){
  p.st='up';render();
  later(()=>{p.st='proc';render()},900);
  later(()=>{p.st='ok';touch(g);render()},1800);
}

/* ---------- router & render ---------- */
function route(){
  const h=location.hash.replace(/^#\/?/,'').split('/');
  if(h[0]==='g'&&G(h[1]))return {page:'g',gid:h[1],tab:['photos','favorites','final'].includes(h[2])?h[2]:'photos'};
  if(h[0]==='settings')return {page:'settings'};
  if(h[0]==='c')return {page:'c',token:h[1]||''};
  return {page:'dash'};
}
const go=h=>{if(location.hash===h)render();else location.hash=h};
const byToken=t=>S.galleries.find(g=>g.token===t||g.id===t);
const fx=[];let keepEl=null;
function runFx(){while(fx.length){const [sel,cls,ms]=fx.shift();$$(sel).forEach(el=>{el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);if(ms)setTimeout(()=>el.classList.remove(cls),ms)})}}
const stamp=root=>$$('[data-r],[data-t]',root).forEach(el=>{el._s=el.outerHTML});
// Replace only the regions whose markup changed; grids keep untouched tiles so images and focus stay put.
function patch(root,html){
  const t=document.createElement('div');t.innerHTML=html;
  const olds=$$('[data-r]',root),news=$$('[data-r]',t);
  if(olds.length!==news.length||olds.some((o,i)=>o.dataset.r!==news[i].dataset.r)){root.innerHTML=html;stamp(root);return}
  olds.forEach((o,i)=>{
    const n=news[i];if(o._s===n.outerHTML)return;
    const a=document.activeElement;if((a&&a.matches('input')&&o.contains(a))||(keepEl&&o.contains(keepEl)))return;
    const ot=$$(':scope>[data-t]',o),nt=$$(':scope>[data-t]',n);
    if(ot.length&&ot.length===nt.length&&o.className===n.className&&ot.every((x,j)=>x.dataset.t===nt[j].dataset.t)){
      ot.forEach((x,j)=>{if(x._s!==nt[j].outerHTML){x.replaceWith(nt[j]);nt[j]._s=nt[j].outerHTML}});o._s=n.outerHTML;return}
    o.replaceWith(n);stamp(n);n._s=n.outerHTML;
  });
}
function render(){
  const r=route(),app=$('#app');
  document.documentElement.lang=S.lang;
  let html,key;
  if(r.page==='g'){const g=G(r.gid);S.ui.lastG=g.id;html=gallery(g,r.tab);key='g:'+g.id;document.title=`${g.title} · PhotoProofing`}
  else if(r.page==='settings'){html=settings();key='settings';document.title=`${t('settings')} · PhotoProofing`}
  else if(r.page==='c'){const g=byToken(r.token);html=clientView(g);key='c:'+r.token+clientState(g)+S.lang;document.title=g&&clientState(g)!=='nf'?`${g.title}`:'PhotoProofing'}
  else{html=dashboard();key='dash'+(S.ui.emptyWs||!S.galleries.some(g=>!g.deleted));document.title='PhotoProofing'}
  const moved=app.dataset.k!==key;if(moved||app.dataset.l!==S.lang){const y=scrollY;app.innerHTML=html;app.dataset.k=key;app.dataset.l=S.lang;stamp(app);scrollTo(0,moved?0:y)}else patch(app,html);
  if(S.ui.pv)renderPreview();
  if(S.ui.vw)renderViewer();
  renderDemo();fitCq();runFx();
}
function fitCq(){$$('[data-cq]').forEach(el=>{const w=el.clientWidth;if(w)el.style.setProperty('--cw',w/100+'px')})}

/* ---------- demo control ---------- */
const CSTATE=k=>t('cs.'+{proof:'proof',em:'em',fin:'fin',cl:'cl',nf:'nf'}[k]);
function renderDemo(){
  const d=$('#demo'),client=route().page==='c',open=d.classList.contains('open');
  const links=S.galleries.map(g=>`<a data-a="clink" data-v="${g.token}">${esc(g.title)}<span>${CSTATE(clientState(g))}</span></a>`).join('');
  const html=`<div class="box" role="dialog" aria-label="${t('demo.aria')}"><div class="seg2"><button class="${client?'':'on'}" data-a="role" data-v="p">${t('demo.photographer')}</button><button class="${client?'on':''}" data-a="role" data-v="c">${t('demo.client')}</button></div>
    <button class="act" data-a="emptyws">${t('demo.emptyDash')}<span class="tg${S.ui.emptyWs?' on':''}"></span></button>
    <button class="act" data-a="reset">${t('demo.reset')}${rtI.replace(/20/g,'16')}</button>
    <div class="links">${links}</div></div>
    <button class="pill" data-a="demo" aria-expanded="${open}"><b>${t('demo.pill')}</b>${t(client?'demo.clientView':'demo.photographerView')}</button>`;
  if(d._s!==html){d.innerHTML=html;d._s=html}
}

/* ---------- actions ---------- */
const cur=()=>{const r=route();return r.page==='g'?G(r.gid):null};
const clientList=(g,preview)=>{const fin=preview?g.status==='delivered':clientState(g)==='fin';const l=ready(fin?g.finals:g.photos);
  return !fin&&S.ui.cf==='fav'?l.filter(p=>preview?S.ui.pv.fav.has(p.id):p.fav):l};
const findP=(g,id)=>g.photos.find(p=>p.id===id)||g.finals.find(p=>p.id===id);
const listOf=(g,p)=>g.finals.includes(p)?g.finals:g.photos;
async function removePhotos(g,ids,{anim=true}={}){
  if(anim){ids.forEach(id=>{const t=$(`#app [data-t="${id}"]`);if(t)t.classList.add('out')});await new Promise(r=>setTimeout(r,RM.matches?0:260))}
  g.photos=g.photos.filter(p=>!ids.includes(p.id));g.finals=g.finals.filter(p=>!ids.includes(p.id));
  if(ids.includes(g.hero))g.hero=null;touch(g);
}
const delConfirm=(ps)=>ps.length===1
  ?confirmDlg({vis:`<img src="${U(ps[0].img,200)}" alt="">`,title:t('del1.title'),text:t(ps[0].fav?'del1.textFav':'del1.text'),cancel:t('keepIt'),ok:t('delete'),kind:'danger'})
  :confirmDlg({vis:stackOf(ps),title:t('delN.title',{n:ps.length}),text:t(ps.some(p=>p.fav)?'delN.textFav':'delN.text'),cancel:t('keepThem'),ok:t('delN.ok',{n:ps.length}),kind:'danger'});

// The top bar is re-rendered with every state change, so give focus back to the language button.
const refocusLang=()=>queueMicrotask(()=>{const b=$('[data-a=lang]');if(b)b.focus()});
const A={
  lang(){S.ui.menu=S.ui.menu==='lang'?null:'lang';refocusLang()},
  setlang(el){S.lang=el.dataset.v;S.ui.menu=null;$('#overlay').dataset.k='';refocusLang();queueMicrotask(()=>toast(t('saved')))},
  bell(){S.ui.menu=S.ui.menu==='bell'?null:'bell'},
  avatar(){S.ui.menu=S.ui.menu==='avatar'?null:'avatar'},
  signout(){S.ui.menu=null;toast(t('signedOut'))},
  markall(){S.notes.forEach(n=>n.unread=false);S.ui.menu=null},
  note(el){const n=S.notes.find(x=>x.gid===el.dataset.g);n.unread=false;S.ui.menu=null;go(`#/g/${n.gid}/${n.kind==='sel'?'favorites':'final'}`)},
  open(el){const n=S.notes.find(x=>x.gid===el.dataset.g&&x.unread);if(n){n.unread=false;go(`#/g/${n.gid}/${n.kind==='sel'?'favorites':'final'}`)}else go(`#/g/${el.dataset.g}/photos`)},
  async new(){const v=await formDlg(t('new.title'),`<label class="fld">${t('new.label')}<input name="t" required autocomplete="off" placeholder="Camille & Hugo"></label>`,t('new.create'));
    if(!v||!v.t.trim())return;
    const g={id:'n'+(++uid),token:tok(),title:v.t.trim(),date:Date.now(),place:'',status:'draft',archived:false,deleted:false,photos:[],finals:[],hero:null,layout:'mas',wm:{on:true},included:10,until:Date.now()+90*DAY,created:Date.now(),updated:Date.now(),sharedAt:null,deliveredAt:null};
    S.galleries.unshift(g);S.ui.emptyWs=false;go(`#/g/${g.id}/photos`)},
  dd(el){S.ui.menu=S.ui.menu===el.dataset.k?null:el.dataset.k},
  st(el){const k=el.dataset.k,on=S.ui.on;on.has(k)?on.delete(k):on.add(k)},
  stall(){ORDER.forEach(k=>S.ui.on.add(k))},
  streset(){S.ui.on=new Set(['dra','pro','del','exp'])},
  sort(el){S.ui.sort=el.dataset.k;S.ui.menu=null},
  clear(){S.ui.q='';S.ui.on=new Set(['dra','pro','del','exp']);const q=$('[data-in=q]');if(q)q.value=''},
  tab(el){go(`#/g/${cur().id}/${el.dataset.v}`)},
  upload(){const g=cur();upload(g,route().tab==='final'?'final':'photos')},
  select(){S.ui.sel=new Set();S.ui.selTab=route().tab},
  selx(){S.ui.sel=null},
  selall(){const g=cur();S.ui.sel=new Set(ready(tabList(g,S.ui.selTab)).map(p=>p.id))},
  seldl(){const n=S.ui.sel.size;if(!n)return;S.ui.sel=null;toast(tn('dling',n))},
  fdl(){toast(t('downloaded'))},
  thero(el){setHero(cur(),findP(cur(),el.dataset.id))},
  pick(el){const s=S.ui.sel,id=el.dataset.id;s.has(id)?s.delete(id):s.add(id)},
  async seldel(){const g=cur(),ids=[...S.ui.sel],ps=ids.map(id=>findP(g,id));if(!ids.length)return;
    if(!await delConfirm(ps))return;S.ui.sel=null;render();await removePhotos(g,ids)},
  async del(el){const g=cur(),p=findP(g,el.dataset.id);if(!await delConfirm([p]))return;await removePhotos(g,[p.id])},
  retry(el){const g=cur();retryPhoto(g,findP(g,el.dataset.id))},
  view(el){const g=cur(),tab=route().tab,src=tab==='final'?g.finals:tab==='favorites'?g.photos.filter(p=>p.fav):g.photos;
    const ids=src.filter(p=>p.st==='ok'||p.st==='fail').map(p=>p.id);openViewer({gid:g.id,who:'me',list:tab,ids,i:ids.indexOf(el.dataset.id)})},
  preview(){openPreview(cur())},
  share(){shareFlow(cur())},
  doshare(){doShare(cur())},
  copy(){const g=cur()||G(S.ui.lastG);try{navigator.clipboard.writeText(`https://${linkUrl(g)}`).catch(()=>{})}catch(e){}toast(t('linkCopied'))},
  email(){toast(t('emailOpened'))},
  sms(){toast(t('smsOpened'))},
  openc(){go(`#/c/${cur().token}`)},
  deliver(){deliverFlow(cur())},
  restore(){const g=cur();g.archived=false;touch(g);toast(t('restored'))},
  async archive(){const g=cur();if(!await confirmDlg({vis:EBOX.replace(imgI,ic.box),title:t('arch.title'),text:t('arch.text'),ok:t('archive')}))return;g.archived=true;touch(g);toast(t('archived'))},
  async gdelete(){const g=cur(),ps=ready(g.photos.concat(g.finals));
    if(!await confirmDlg({vis:ps.length?stackOf(ps):EBOX,title:t('gdel.title'),text:t('gdel.text'),cancel:t('keepIt'),ok:t('delete'),kind:'danger'}))return;
    g.deleted=true;go('#/dashboard');toast(t('gdel.done'))},
  layout(el){const g=cur();g.layout=el.dataset.v},
  wmon(){const g=cur();g.wm.on=!g.wm.on;touch(g);if(g.wm.on)regenerate([g])},
  fly(el){S.ui.fly=S.ui.fly===el.dataset.v?null:el.dataset.v},
  dlfavs(){const g=cur();S.ui.busy[g.id]=1;later(()=>{delete S.ui.busy[g.id];toast(t('downloaded'));render()},1600)},
  toastx(el){el.closest('.toast').remove()},
  pvmode(el){S.ui.pv.ph=el.dataset.v==='1'},
  pvclose(){S.ui.pv=null;renderPreview()},
  heart(el,pv){if(pv)return;const g=pv?G(S.ui.pv.gid):byToken(route().token),id=el.dataset.id;let on;
    if(pv){const f=S.ui.pv.fav;on=!f.has(id);on?f.add(id):f.delete(id)}else{const p=findP(g,id);p.fav=on=!p.fav;notify(g.id,'sel')}
    fx.push([`[data-a=heart][data-id="${id}"]`,on?'pop':'unpop',600],['.cf .n','bump',400])},
  cf(el){S.ui.cf=el.dataset.v},
  cview(el,pv){const g=pv?G(S.ui.pv.gid):byToken(route().token),ids=clientList(g,pv).map(p=>p.id);openViewer({gid:g.id,who:'client',preview:pv,ids,i:ids.indexOf(el.dataset.id)})},
  cdl(el,pv){const g=pv?G(S.ui.pv.gid):byToken(route().token),p=findP(g,el.dataset.id);if(!pv){p.dl=true;notify(g.id,'dl',1)}toast(t('downloaded'))},
  cdlall(el,pv){const g=pv?G(S.ui.pv.gid):byToken(route().token),l=ready(g.finals);if(!pv){const n=l.filter(p=>!p.dl).length||l.length;l.forEach(p=>p.dl=true);notify(g.id,'dl',n)}toast(tn('dling',l.length))},
  cgo(el){const b=el.closest('.cp').querySelector('.cbar');b.scrollIntoView({behavior:RM.matches?'auto':'smooth'})},
  vx(){closeViewer()},vprev(){vwStep(-1)},vnext(){vwStep(1)},
  vheart(){const v=S.ui.vw;if(v.preview)return;const {g,p}=vwPhoto();let on;
    if(v.preview){const f=S.ui.pv.fav;on=!f.has(p.id);on?f.add(p.id):f.delete(p.id)}else{p.fav=on=!p.fav;notify(g.id,'sel')}
    fx.push(['#viewer .hv,#viewer .hbig',on?'pop':'unpop',600])},
  vdl(){const v=S.ui.vw,{g,p}=vwPhoto();if(!v.preview){p.dl=true;notify(g.id,'dl',1)}toast(t('downloaded'))},
  vhero(){const {g,p}=vwPhoto();setHero(g,p)},
  async vdel(){const v=S.ui.vw,{g,p}=vwPhoto();if(!await delConfirm([p]))return;
    await removePhotos(g,[p.id],{anim:false});v.ids=v.ids.filter(x=>x!==p.id);v.i=Math.min(v.i,v.ids.length-1);if(!v.ids.length)S.ui.vw=null},
  vretry(){const {g,p}=vwPhoto();retryPhoto(g,p)},
  ws(el){const k=el.dataset.k,v=el.dataset.v,s=S.wsd;
    if(k==='rep')s.rep=v==='1';else if(k==='pl')s.pl=+v;else if(k==='logo')s.logo=v==='1';else s[k]=v},
  wssave(){const wmChanged=WM_KEYS.some(k=>S.wsd[k]!==S.ws[k]);S.ws={...S.wsd};render();fx.push(['.stg .sv.p','done',1600]);
    if(wmChanged){regenerate(S.galleries.filter(g=>!g.deleted&&g.wm.on&&ready(g.photos).length));toast(t('stg.regen'))}},
  wscancel(){S.wsd={...S.ws};render();fx.push(['.stg .sv.cn','done',1400])},
  demo(){$('#demo').classList.toggle('open');return 'skip'},
  role(el){$('#demo').classList.remove('open');if(el.dataset.v==='c'){const g=G(S.ui.lastG)||G('camille');go(`#/c/${g?g.token:'x'}`)}else go(S.ui.lastG&&G(S.ui.lastG)?`#/g/${S.ui.lastG}/photos`:'#/dashboard')},
  clink(el){$('#demo').classList.remove('open');go(`#/c/${el.dataset.v}`)},
  emptyws(){S.ui.emptyWs=!S.ui.emptyWs;go('#/dashboard')},
  reset(){timers.forEach(clearTimeout);timers=[];const q=seed();S.ws=q.ws;S.wsd=q.wsd;S.galleries=q.galleries;S.notes=q.notes;
    Object.assign(S.ui,{q:'',on:new Set(['dra','pro','del','exp']),sort:'upd',menu:null,sel:null,fly:null,cf:'all',emptyWs:false,lastG:'camille',busy:{},regen:{},pv:null,vw:null,selTab:null});
    $('#demo').classList.remove('open');if(modalDone)closeModal(false);renderPreview();renderViewer();go('#/dashboard');toast(t('demo.resetDone'))},
};
function setHero(g,p){const was=heroOf(g)===p;g.hero=was?null:p.id;touch(g);fx.push(['.banner','flash',900]);toast(t(was?'heroRemoved':'heroUpdated'))}
const WM_KEYS=['name','logo','wm','rep','pl','k'];
// Regeneration is simulated: each gallery shows a quiet indicator until its deadline passes.
function regenerate(gs){const until=Date.now()+5200;gs.forEach(g=>{S.ui.regen[g.id]=until});later(render,5300)}
// Inline side-nav fields commit on change; invalid input is reverted with an error toast.
const CH={
  until(g,i){const t=Date.parse(i.value);if(!i.value||Number.isNaN(t))return false;g.until=t+12*36e5;
    if(g.status==='expired'&&g.until>Date.now())g.status='shared';else if(g.status==='shared'&&g.until<Date.now())g.status='expired';return true},
  incl(g,i){const n=Number(i.value);if(i.value===''||!Number.isInteger(n)||n<0||n>999)return false;g.included=n;return true},
};
let savedT;
function commitField(i){const g=cur(),f=CH[i.dataset.ch];if(!g||!f)return;
  if(!f(g,i)){toast(t(i.dataset.ch==='incl'?'stg.badNumber':'stg.badDate'),false);i.value=i.dataset.ch==='incl'?g.included:isoDay(g.until);return}
  touch(g);i.classList.remove('saved');void i.offsetWidth;i.classList.add('saved');
  clearTimeout(savedT);savedT=setTimeout(()=>{toast(t('saved'));$$('.kv input.saved').forEach(x=>x.classList.remove('saved'))},500);
  keepEl=i;render();keepEl=null}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const m=e.target.closest('[data-m]');
  if(m){closeModal(m.dataset.m==='1');return}
  if(e.target.id==='modal'){closeModal(false);return}
  const el=e.target.closest('[data-a]');
  let dirty=false;
  if(S.ui.menu&&!e.target.closest('.panel,.menu,.dd')&&!(el&&['bell','avatar','dd','lang'].includes(el.dataset.a))){S.ui.menu=null;dirty=true}
  if(S.ui.fly&&!e.target.closest('.r3')){S.ui.fly=null;dirty=true}
  if(!e.target.closest('#demo'))$('#demo').classList.remove('open');
  if(!el||el.closest('.dis,[aria-disabled=true]')||el.disabled){if(dirty)render();return}
  const f=A[el.dataset.a];if(!f){if(dirty)render();return}
  if(el.tagName==='A'&&!el.getAttribute('href'))e.preventDefault();
  const pv=!!el.closest('#overlay')||!!(S.ui.vw&&S.ui.vw.preview&&el.closest('#viewer'));
  const r=f(el,pv);
  if(r==='skip')return;
  if(r&&r.then)await r;
  render();
});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();closeModal(Object.fromEntries(new FormData(f)))});
document.addEventListener('input',e=>{const i=e.target,k=i.dataset.in;if(!k)return;
  if(k==='q')S.ui.q=i.value;else if(k==='wsname')S.wsd.name=i.value;else if(k==='wsk')S.wsd.k=+i.value;
  keepEl=i;render();keepEl=null});
document.addEventListener('change',e=>{if(e.target.dataset.ch)commitField(e.target)});
document.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.ch)setTimeout(render,0)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(modalDone)return closeModal(false);if(S.ui.vw)return closeViewer();if(S.ui.pv){S.ui.pv=null;return renderPreview()}
    if(S.ui.menu||S.ui.fly||S.ui.sel){const wasLang=S.ui.menu==='lang';S.ui.menu=S.ui.fly=null;S.ui.sel=null;render();if(wasLang)refocusLang()}$('#demo').classList.remove('open');return}
  if(modalDone)return;
  if(S.ui.vw){if(e.key==='ArrowLeft')vwStep(-1);else if(e.key==='ArrowRight')vwStep(1);
    else if((e.key==='f'||e.key==='F')&&S.ui.vw.who==='client'&&$('#viewer [data-a=vheart]')){A.vheart();render()}return}
  if(e.key==='Enter'&&e.target.matches('[tabindex][data-a]'))e.target.click();
});
let tx=null;
$('#viewer').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#viewer').addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50)vwStep(dx<0?1:-1)});
addEventListener('hashchange',()=>{S.ui.vw=null;S.ui.pv=null;S.ui.menu=null;S.ui.fly=null;S.ui.cf='all';
  S.ui.sel=null;
  if(modalDone)closeModal(false);renderPreview();renderViewer();render()});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(fitCq,80)});
RM.addEventListener&&RM.addEventListener('change',render);

if(!location.hash)history.replaceState(null,'','#/dashboard');
render();
</script>
</body></html>
