<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>client-gallery</title><style>body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:#fff}</style></head><body><h2>Client views: selecting and delivered</h2>
<p class="subtitle">Switch the state above the page. Selecting: heart photos, click one to open the viewer. Delivered: favorites locked, download one or all.</p>

<style>
  .st{font:12px system-ui;margin-bottom:10px}
  .st .b{border:1px solid #2b2420;border-radius:99px;padding:6px 14px;cursor:pointer;margin-right:6px;display:inline-block}
  .st .b.on{background:#2b2420;color:#f4efe8}
  .pg{background:#f4efe8;color:#2b2420;font-family:Georgia,serif;border-radius:8px;overflow:hidden;position:relative}
  .cover{height:170px;background:linear-gradient(160deg,#c9b8a6,#6b7f8e);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
  .cover h1{font-weight:400;font-size:30px;margin:0;text-transform:lowercase}
  .cover .k{font:11px system-ui;letter-spacing:.3em;text-transform:uppercase;opacity:.9;margin-top:8px}
  .sub{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-bottom:1px solid #e0d6c8;font:11px system-ui;letter-spacing:.2em;text-transform:uppercase;min-height:34px}
  .pill{border:1px solid #2b2420;background:transparent;color:#2b2420;padding:6px 14px;border-radius:99px;font:12px system-ui;letter-spacing:.08em;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .pill.on{background:#2b2420;color:#f4efe8}
  .pill.over .n{color:#b5381f;font-weight:700}
  .pill.fill{background:#2b2420;color:#f4efe8}
  .masonry{columns:3;column-gap:8px;padding:20px 24px;min-height:240px}
  .ph{break-inside:avoid;margin-bottom:8px;position:relative;border-radius:2px;cursor:pointer}
  .ic{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(244,239,232,.92);color:#2b2420;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
  .ph:hover .ic{opacity:1}
  .ph.s .ic{opacity:1;background:#2b2420;color:#f4efe8}
  .del .ph .ic{background:rgba(244,239,232,.92);color:#2b2420}
  .note{padding:0 24px 18px;font:12px system-ui;color:#7a6c5f;text-align:center}
  .lb{display:none;position:absolute;inset:0;background:rgba(20,16,13,.94);z-index:9;align-items:center;justify-content:center;flex-direction:column}
  .lb.open{display:flex}
  .lbimg{width:60%;height:62%;border-radius:3px}
  .lbbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;color:#f4efe8;font:12px system-ui;letter-spacing:.1em}
  .lbbtn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(244,239,232,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#f4efe8}
  .lbbtn.on{background:#f4efe8;color:#2b2420}
  .nav{position:absolute;top:50%;width:36px;height:36px;margin-top:-18px;border-radius:50%;border:1px solid rgba(244,239,232,.4);color:#f4efe8;display:flex;align-items:center;justify-content:center;cursor:pointer}
</style>

<div class="st" id="st">State: <span class="b on" data-m="sel">Selecting</span><span class="b" data-m="del">Delivered</span> <span style="color:#7a6c5f;margin-left:8px">Allowance 4</span></div>

<div class="pg" id="pg">
  <div class="cover"><h1>martin wedding</h1><div class="k" id="k">June 12 · 8 photos</div></div>
  <div class="sub"><span id="mode">All photos</span><span id="ctl"></span></div>
  <div class="masonry" id="grid"></div>
  <div class="note" id="note"></div>

  <div class="lb" id="lb">
    <div class="lbbar"><span id="lbc">1 / 8</span><span style="display:flex;gap:10px"><span class="lbbtn" id="lbact"></span><span class="lbbtn" id="lbx"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></span></span></div>
    <span class="nav" style="left:16px" id="prv">‹</span><div class="lbimg" id="lbimg"></div><span class="nav" style="right:16px" id="nxt">›</span>
  </div>
</div>

<script>
(function(){
  var P=[['#d8c3ae','#8a6e58',180],['#a9b8a8','#4c6652',120],['#e3cfc0','#b5806a',150],['#b7c1d1','#55648a',130],['#cdb9a2','#7a5f4a',190],['#d9d1c0','#8f8a6a',110],['#e0c3b0','#a0624a',160],['#b8c4d6','#4a5a7a',140]];
  var sel=[0,3],mode='sel',only=false,ALLOW=4,cur=0;
  var heart='<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 21s-7-4.5-9.3-9A5.2 5.2 0 0 1 12 6.6 5.2 5.2 0 0 1 21.3 12C19 16.5 12 21 12 21Z"/></svg>';
  var heartO=heart.replace('fill="currentColor"','fill="none"');
  var dl='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>';
  var $=function(i){return document.getElementById(i);};
  function bg(c){return 'linear-gradient(135deg,'+c[0]+','+c[1]+')';}
  function render(){
    var g=$('grid');g.innerHTML='';g.className='masonry'+(mode==='del'?' del':'');
    P.forEach(function(c,i){
      var isS=sel.indexOf(i)>-1;
      if(mode==='sel'&&only&&!isS)return;
      var d=document.createElement('div');d.className='ph'+(mode==='sel'&&isS?' s':'');
      d.style.height=c[2]+'px';d.style.background=bg(c);
      d.innerHTML='<span class="ic">'+(mode==='del'?dl:(isS?heart:heartO))+'</span>';
      d.querySelector('.ic').onclick=function(e){e.stopPropagation();if(mode==='del')return;toggle(i);};
      d.onclick=function(){open(i);};
      g.appendChild(d);
    });
    var n=sel.length;
    if(mode==='sel'){
      $('k').textContent='June 12 · 8 photos';$('mode').textContent=only?'Your selection':'All photos';
      $('ctl').innerHTML='<button class="pill'+(only?' on':'')+(n>ALLOW?' over':'')+'" id="pill">'+heartO.replace('15','13').replace('15','13')+'<span class="n">'+n+'</span> / '+ALLOW+'</button>';
      $('pill').onclick=function(){only=!only;render();};
      $('note').textContent='Tap a heart to choose a favorite. Your photographer sees changes as they happen.';
    }else{
      $('k').textContent='June 12 · Your finished photos';$('mode').textContent='Finished photos · 8';
      $('ctl').innerHTML='<button class="pill fill" id="zip">'+dl.replace('15','13').replace('15','13')+' Download all (ZIP)</button>';
      $('note').textContent='Your selection is final. Tap a photo to open it, or the arrow to download one.';
    }
  }
  function toggle(i){var k=sel.indexOf(i);if(k>-1)sel.splice(k,1);else sel.push(i);render();if($('lb').classList.contains('open'))lbr();}
  function lbr(){
    $('lbimg').style.background=bg(P[cur]);$('lbc').textContent=(cur+1)+' / '+P.length;
    var a=$('lbact');
    if(mode==='sel'){var s=sel.indexOf(cur)>-1;a.innerHTML=s?heart:heartO;a.className='lbbtn'+(s?' on':'');a.title='Favorite';a.onclick=function(){toggle(cur);};}
    else{a.innerHTML=dl;a.className='lbbtn';a.title='Download';a.onclick=null;}
  }
  function open(i){cur=i;lbr();$('lb').classList.add('open');}
  $('lbx').onclick=function(){$('lb').classList.remove('open');};
  $('prv').onclick=function(){cur=(cur+P.length-1)%P.length;lbr();};
  $('nxt').onclick=function(){cur=(cur+1)%P.length;lbr();};
  Array.prototype.forEach.call($('st').querySelectorAll('[data-m]'),function(b){b.onclick=function(){
    mode=b.dataset.m;only=false;$('lb').classList.remove('open');
    Array.prototype.forEach.call($('st').querySelectorAll('[data-m]'),function(x){x.classList.toggle('on',x===b);});render();};});
  render();
})();
</script>
</body></html>
