[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap-config-fallback = { version = "0.3", features = ["derive"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
thiserror = "2"
eyre = "0.6"
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_with = { version = "3", default-features = false, features = ["std"] }
actix-web = "4"
actix-web-lab = { version = "0.29", default-features = false }
base64 = "0.23"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
derive_more = { version = "2.1.1", features = ["display", "from", "from_str", "deref"] }
hmac = "0.13"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "ring", "rustls-native-certs", "smtp-transport", "tokio1", "tokio1-rustls"] }
pp-core = { path = "crates/core" }
pp-database = { path = "crates/database" }
pp-storage = { path = "crates/storage" }
rand = "0.10"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false }
subtle = { version = "2.6", default-features = false }
libvips = "2.3.0"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
