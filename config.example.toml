# Copy to config.toml (gitignored) and pass with --config or PP_CONFIG.
# Precedence: CLI flag > environment variable > config file > default.
# Placeholders only: never commit real secrets.
host = "127.0.0.1"
port = 8080
log_level = "info"

[session]
idle_timeout = "30d"

[database]
# Local-only synthetic credentials.
url = "postgres://pp:pp-local-only@127.0.0.1:5432/pp"

[auth]
app_origin = "http://localhost:5173"

[limiter]
max_failures = 10
window = "1m"
max_peers = 1024
