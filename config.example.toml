# Copy to config.toml (gitignored) and pass with --config or PP_CONFIG.
# Precedence: CLI flag > environment variable > config file > default.
# Placeholders only: never commit real secrets.
# For containers: host = "0.0.0.0", photo.dir = "/var/lib/pp/photos".
# For HTTPS: set auth.app_origin to the browser origin and session.secure_cookie = true.
# Deployments install the adjusted non-secret file at /etc/pp/config.toml,
# omit [database], and inject PP_DATABASE_URL from the secret manager.
host = "127.0.0.1"
port = 8080
log_level = "info"

[session]
idle_timeout = "30d"
secure_cookie = false
cookie_name = "pp_session"

[database]
# Local-only synthetic credentials.
url = "postgres://pp:pp-local-only@127.0.0.1:5432/pp"

[auth]
app_origin = "http://localhost:5173"
# Password hashes computed at once. Argon2 is memory-hungry: raise it only with memory to match.
hash_concurrency = 2

[limiter]
max_failures = 10
window = "1m"
max_peers = 1024

# Image worker queue. max_attempts is read by the API, which records it on each job it
# enqueues; the other keys are read by pp-image-worker.
[queue]
max_attempts = 5
# Most photos one cleanup job names when photos are deleted; read by the API.
cleanup_batch = 500
poll_interval = "5s"
lease = "60s"
concurrency = 2
backoff_base = "10s"
backoff_cap = "5m"
shutdown_grace = "30s"

# Worker only. Files younger than this are never swept as orphans.
[cleanup]
orphan_grace = "24h"
# Sweeps requested sooner than this after the last successful one are skipped.
sweep_interval = "1h"

# Selection ZIPs built by the worker for the photographer's Favorites tab; read by both.
[selection_export]
# Most bytes of originals one ZIP may hold; a larger selection is refused.
size_limit = 2147483648
# How long a finished ZIP stays downloadable (1m to 30d); its file is removed afterwards.
retention = "24h"

[photo]
# Private photo files; the API and the worker must share this directory.
dir = "./data/photos"

[photo_upload]
# Positive integer upload limits: bytes, pixels, and simultaneous requests.
max_size = 67108864
max_pixels = 100000000
concurrency = 4
# Wait announced to an upload refused because every slot is taken (1s to 1m).
retry_after = "1s"
# How long an upload body may stay silent before it is abandoned with a 408 (1s to 10m).
body_idle_timeout = "30s"

[events]
# Live dashboard updates. Keep-alive period (also how soon a signed-out stream closes), and how
# many streams may be open at once, overall and per workspace.
keep_alive = "15s"
# Keep-alive periods a stream may go unread before it is closed as stalled (at least 2).
stall_intervals = 3
max_streams = 256
max_streams_per_workspace = 32
# Events buffered per stream before it lags and is told to resync (1 to 65535).
capacity = 1024
# Delay before the database listener is reopened after a failure: starts at the first value,
# doubles per failure up to the cap (10ms to 5m).
relay_backoff_start = "250ms"
relay_backoff_cap = "30s"

[process]
# Positive integer pixel limit for originals the worker renders; match photo_upload.
max_pixels = 100000000
