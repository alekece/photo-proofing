# Copy to config.toml (gitignored) and pass with --config or EG_CONFIG.
# Precedence: CLI flag > environment variable > config file > default.
# Placeholders only: never commit real secrets.
host = "127.0.0.1"
port = 8080
log_level = "info"
# Upload limits (env: EG_UPLOAD_MAX_FILES, EG_UPLOAD_MAX_FILE_BYTES, EG_UPLOAD_MAX_MEGAPIXELS).
upload_max_files = 100
upload_max_file_bytes = 104857600 # 100 MiB
upload_max_megapixels = 100
