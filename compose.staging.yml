# Use with docker-compose.yml through deploy/staging.yml.
# !reset / !override require Docker Compose 2.24.4 or newer.
name: pp-staging

x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *runtime
    ports: !reset []
    environment: !override
      POSTGRES_USER: pp
      POSTGRES_DB: pp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?the secret manager must supply POSTGRES_PASSWORD}

  api:
    <<: *runtime
    image: ghcr.io/alekece/pp-api:${PP_IMAGE_TAG:?Select a published commit}
    build: !reset null
    ports: !reset []
    environment: !override
      PP_CONFIG: /etc/pp/config.toml
      PP_DATABASE_URL: ${PP_DATABASE_URL:?Supply the encoded database URL}
    labels:
      pp.config-sha256: ${PP_CONFIG_SHA256:?Read the runtime configuration checksum}
    volumes:
      - type: bind
        source: ${PP_RUNTIME_CONFIG:?Select the non-secret TOML file}
        target: /etc/pp/config.toml
        read_only: true
        bind:
          create_host_path: false

  worker:
    <<: *runtime
    image: ghcr.io/alekece/pp-image-worker:${PP_IMAGE_TAG:?Select a published commit}
    build: !reset null
    environment: !override
      PP_CONFIG: /etc/pp/config.toml
      PP_DATABASE_URL: ${PP_DATABASE_URL:?Supply the encoded database URL}
    labels:
      pp.config-sha256: ${PP_CONFIG_SHA256:?Read the runtime configuration checksum}
    volumes:
      - type: bind
        source: ${PP_RUNTIME_CONFIG:?Select the non-secret TOML file}
        target: /etc/pp/config.toml
        read_only: true
        bind:
          create_host_path: false

  web:
    <<: *runtime
    image: ghcr.io/alekece/pp-web:${PP_IMAGE_TAG:?Select a published commit}
    build: !reset null
    ports: !reset []
    environment: !override
      PP_API_INTERNAL_URL: http://api:8080
      ORIGIN: ${PP_APP_ORIGIN:?Read the browser origin from TOML}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  proxy:
    <<: *runtime
    labels:
      pp.config-sha256: ${PP_PROXY_CONFIG_SHA256:?Read the proxy configuration checksum}
    environment:
      PP_STAGING_HOST: ${PP_STAGING_HOST:?Read the HTTPS hostname from TOML}
    ports: !override
      - "${PP_BIND_ADDRESS:?Select a loopback or LAN address}:443:443"
    volumes: !override
      - ./docker/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/proxy-health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
    external: true
    name: ${PP_POSTGRES_VOLUME:?Select the existing database volume}
  photo-data:
    external: true
    name: ${PP_PHOTO_VOLUME:?Select the existing photo volume}
  caddy-data:
    external: true
    name: ${PP_CADDY_DATA_VOLUME:?Select the existing Caddy data volume}
  caddy-config:
    external: true
    name: ${PP_CADDY_CONFIG_VOLUME:?Select the existing Caddy config volume}
